name: lacy-runtime-spec
version: 1.0.0
status: specification-only
purpose: Persistent runtime engine specification for Lacy
scope:
  execution_mode: manual-only
  auto_start: false
  hidden_processes: false
  service_installation: false
  runtime_actions: documented-only

